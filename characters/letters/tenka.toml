[[paragraphs]]
ja = "[shyly] えと……甜花、しばらく遠いところに行きます。前は余ってた便箋、最近はすぐなくなっちゃう……にへへ。"
zh = "那个……甜花要去很远的地方一阵子。以前总是用不完的信纸，最近一下子就用完了……嘿嘿。"

[[paragraphs]]
ja = "面接の日……プロデューサーさん、甜花に合格って言ってくれたよね。アイドルのこと、なんにも知らなかったのに……。"
zh = "面试那天……制作人对甜花说了「合格」呢。明明那时候，我对偶像什么都不懂……"

[[paragraphs]]
ja = "ひとりでステージに立てた日……なーちゃんの隣に、少し近づけた気がしたの。待っててくれて、ありがとう……。"
zh = "一个人站上舞台的那天……感觉离小奈身边，近了一点点。谢谢你，一直等着我……"

[[paragraphs]]
ja = "[quietly] プロデューサーさんがいなくなる夢、こわかったな……。でも、これはゲームオーバーじゃないよ。セーブして、ちょっと休むだけ。"
zh = "梦见制作人不见了的那次，好害怕……不过，这次不是游戏结束哦。只是存个档，稍微休息一下。"

[[paragraphs]]
ja = "[softly] また会えたら……つづきから、一緒に遊んでくれる……？　ゲームセンターも……ご褒美に、連れてってほしいな。"
zh = "下次见面的时候……能从存档的地方接着，陪我一起玩吗……？游戏厅也……想让你带我去，当作奖励。"
