# 大崎甜花的信
character = "tenka"
salutation = "プロデューサーさんへ"
signature = "甜花より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/tenka.md「自称」：自称「甜花」",
  "sheets/tenka.md「对他人的称呼」：叫制作人「プロデューサーさん」，叫甘奈「なーちゃん」",
  "sheets/tenka.md「口癖」：「……」断句、「えと……」开头、「にへへ」，游戏说法「ゲームオーバー」「セーブ」，「ご褒美」",
  "facts/tenka.md「卡片里的工作与日常」：第 1 段，【I♡DOLL】里小时候父母买的信纸一直用不完，后来很快就用完了",
  "sheets/tenka.md「身份」：第 2 段，面试上第一个说她合格的是制作人；那时她对偶像还不太懂",
  "facts/tenka.md「W.I.N.G.」：第 3 段，一个人站上舞台，觉得能走到なーちゃん身边了",
  "facts/tenka.md「制作人」：第 4 段，梦见制作人突然离开，很害怕",
  "facts/tenka.md「制作人」：第 5 段，工作的「ご褒美」包括和制作人一起去游戏厅",
  "facts/tenka.md「卡片里的工作与日常」：第 5 段，【秘密のだらだらタイム】里和制作人一起去了游戏厅",
