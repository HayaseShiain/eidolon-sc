# 田中摩美美的信
character = "mamimi"
salutation = "プロデューサーへ"
signature = "ま み み"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/mamimi.md「自称」：自称「まみみ」（第 2、4 段），签名写成「ま み み」（署名）",
  "facts/mamimi.md「自称与签名」：她的签名是「ま み み」",
  "sheets/mamimi.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」；第一次见面时叫他「お兄さん」（第 2 段）",
  "sheets/mamimi.md「口癖」：拖长尾音、「めんどー」「〜ケド」「〜からぁ」，和制作人说话用ですます但从不郑重",
  "facts/mamimi.md「成为偶像的经过」：第 2 段，夜里在街上被制作人搭话",
  "facts/mamimi.md「制作人」：第 3 段，制作人排队买来的巧克力蛋糕；第 4 段，W.I.N.G. 优胜后谢他让自己当上偶像（换成自己的话，嘴上照样不认）",
  "facts/mamimi.md「吃的东西」：第 3 段，生日收到排队买的巧克力蛋糕，回礼是激辣巧克力",
  "facts/mamimi.md「イタズラ」：第 5 段，捉弄人是她最大的乐趣，假装吃掉过制作人的布丁",
]

[[paragraphs]]
ja = "[lazily] えーっと、ちょっと遠くまで出かけることになりましたぁ。めんどーですけど、一応書いときますねー。"
zh = "嗯……我要出趟远门了。虽然很麻烦，还是姑且写一下吧。"

[[paragraphs]]
ja = "夜の街で声かけてきたお兄さんと、こんなに長く一緒にいるなんて、あの頃のまみみは信じないと思いますー。"
zh = "会跟那天晚上在街上搭话的大哥哥一起待这么久，那时候的摩美美肯定不会信吧。"

[[paragraphs]]
ja = "誕生日に並んで買ってくれたチョコレートケーキ、ちゃんと美味しかったですよー。[small laugh] 激辛チョコのお返しは、反省してませんケド。"
zh = "生日那天你排队买来的巧克力蛋糕，其实挺好吃的哦。至于回礼的激辣巧克力，我可一点都没反省。"

[[paragraphs]]
ja = "プロデューサーのせいで、まみみ、すっかりアイドルになっちゃいましたー。……<soft>一応、ありがとうございますー。</soft>別に、ついでですからぁ。"
zh = "都怪制作人，摩美美彻底变成偶像了。……姑且，谢谢你。只是顺便说一下而已啦。"

[[paragraphs]]
ja = "帰ってきたら、またイタズラしに行くのでー、それまで退屈しててくださいねー。冷蔵庫のプリンも、取っといてくださぁい。"
zh = "等我回来，还会去捉弄你的，在那之前就乖乖无聊着吧。冰箱里的布丁也要给我留着哦。"
