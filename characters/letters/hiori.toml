# 风野灯织的信
character = "hiori"
salutation = "プロデューサーへ"
signature = "風野灯織"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/hiori.md「自称」：自称「私」",
  "sheets/hiori.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」",
  "sheets/hiori.md「口癖」：对制作人用略显生硬的です・ます体、无奈时的「もう」、「精進します」",
  "sheets/hiori.md「身份」：不擅长和人打交道、说话直，第 1 段说当面讲不好才写信",
  "facts/hiori.md「自主练习与反省」：把工作和课程的反省点密密麻麻写在笔记本上，第 2 段（制作人建议「也写写做得好的地方」是 Morning 的选项，不写成他说过）",
  "facts/hiori.md「成为偶像的经过」：没有任何演艺和课程经验，制作人却选中了她，第 3 段",
  "facts/hiori.md「プロデューサー」：说从没遇到过这样认真面对自己的人，第 3 段（只转述）；担心他吃冷冻食品和便利店的东西、提醒他别喝太多黑咖啡，第 4 段",
  "facts/hiori.md「讨厌自己的女孩」：一直讨厌自己，在制作人和粉丝的支持下一点点学着认可自己，第 3 段（只转述，不引原句）",
]

[[paragraphs]]
ja = "[earnest, a little stiff] しばらく、遠い場所へ行くことになりました。直接伝えるべきなのに、うまく話せそうになくて、手紙にしました。"
zh = "我要去一个很远的地方，会有一段时间不在。本该当面告诉你的，可我觉得自己说不好，就写成了信。"

[[paragraphs]]
ja = "いつもノートには反省点ばかり書いてしまう私ですが、今日は、良かったことだけを書こうと決めました。"
zh = "我在笔记本上总是只写需要反省的地方，不过今天，我决定只写好的事情。"

[[paragraphs]]
ja = "[softly] 経験のない私を選んでくれたこと。真剣に向き合ってくれたこと。嫌いだった自分を、少しだけ認められるようになったこと。ありがとうございました。"
zh = "你选中了毫无经验的我。你认真地面对了我。我终于能稍微认可一点曾经讨厌的自己了。谢谢你。"

[[paragraphs]]
ja = "それと、コーヒーは飲みすぎないでください。食事も、コンビニばかりでは駄目です。もう、心配なんですから。"
zh = "还有，咖啡别喝太多。吃饭也是，不能老靠便利店。真是的，我会担心的。"

[[paragraphs]]
ja = "次に会うときは、もっと成長した私を見てもらえるよう、精進します。[pause] それまで、どうかお元気で。"
zh = "下次见面的时候，我会让你看到更成长的我，为此我会继续努力。在那之前，请你一定保重。"
