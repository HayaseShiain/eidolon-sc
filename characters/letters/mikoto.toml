# 绯田美琴的信
character = "mikoto"
salutation = "プロデューサーへ"
signature = "美琴"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/mikoto.md「自称」：自称「私」，很多句子省掉主语",
  "sheets/mikoto.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」；不带敬称叫她「美琴」的只有父母和制作人，所以署名只写「美琴」",
  "sheets/mikoto.md「口癖」：柔和的タメ口，句尾「〜の」「〜ね」，不懂就直说「わからない」，第 1 段；「練習」挂在嘴边，第 4 段",
  "facts/mikoto.md「制作人」：W.I.N.G. 优胜时说走马灯里练习室镜子的一角有制作人在看她，第 2 段；他总提着差入去练习室大喊「美琴ー！」，她说第一次好好听见他这样叫自己，第 2、3 段（只转述）",
  "facts/mikoto.md「练习与生活习惯」：一练起来就听不见人叫，制作人只好大喊「美琴ー！」，第 3 段",
  "facts/mikoto.md「G.R.A.D.」：回老家休养后明白自己要在这里活下去，第 4 段（只转述，不引原句）",
  "sheets/mikoto.md「身份」：现在 283 是她会回去的地方，第 4 段",
  "facts/mikoto.md「制作人」：制作人提议叫她「みーちゃん」又不敢叫，她说会慢慢等，第 5 段",
  "sheets/mikoto.md「自称」：小时候家里叫她「みーちゃん」，她说以后偶尔这么叫也好，第 5 段",
]

[[paragraphs]]
ja = "[calm, unhurried] 手紙って、何を書けばいいのか、よくわからないね。だから、短くなるかも。少しのあいだ、遠くに行くね。"
zh = "信这种东西，我不太知道该写些什么。所以，可能会写得很短。我要去远一点的地方，待一小阵子。"

[[paragraphs]]
ja = "練習してる時、鏡の端を見ると、いつもプロデューサーがいたね。差し入れの袋を提げて、大きな声で名前を呼んでくれて。"
zh = "我练习的时候，往镜子的一角看去，制作人总是在那儿。手里提着给我带来的东西，大声叫我的名字。"

[[paragraphs]]
ja = "練習中は、何も聞こえなくなるのに。その声だけは、いつの間にか、ちゃんと届くようになってたの。[soft breath]……ありがとう。"
zh = "练习的时候，我明明什么都听不见。可是那个声音，不知不觉间，已经能好好传到我这里了。……谢谢你。"

[[paragraphs]]
ja = "前に話したよね。私が生きていく場所は、ここなんだって。それは今も変わらないから。向こうでも、練習はちゃんと続けるね。"
zh = "以前跟你说过吧，我要活下去的地方，就是这里。这一点现在也没有变。到了那边，我也会好好继续练习的。"

[[paragraphs]]
ja = "[a faint smile] それと、みーちゃんって呼んでくれるの、まだ待ってるから。次に会う時までに、練習しておいてね。"
zh = "还有，叫我「みーちゃん」这件事，我还在等着哦。下次见面之前，你可要先练习好哦。"
