# 铃木羽那的信
character = "hana"
salutation = "プロデューサーへ"
signature = "羽那より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/hana.md「自称」：自称「あたし」",
  "sheets/hana.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」，从第一天起就说タメ口",
  "sheets/hana.md「口癖」：笑声「あはっ」、「すっごく」、句尾拖长「〜ーっ」、用「……ね？」确认对方心意，第 2、3、5 段",
  "facts/hana.md「S.T.E.P.」：制作人从东京来到冈山的高中发掘她，那时她并没有特别想当偶像，第 2 段",
  "facts/hana.md「W.I.N.G.」：她说制作人会带她去更大的舞台，第 3 段；夺冠那晚发「今すぐ会いに来て」、只是想见他，第 5 段反过来说这次换她去见（只转述）",
  "facts/hana.md「Landing Point」：被制作人一个人替她做了决定，吵过一次；她主动去找他说想让他更了解自己、想和好，第 3 段",
  "facts/hana.md「卡片里的工作与日常」：【Eyes On You】制作人记下摄影师建议的便条，她一直当护身符带着，第 4 段",
]

[[paragraphs]]
ja = "[brightly] プロデューサー、元気ー？　あのね、あたし、ちょっと遠いところに行くことになったの。だから、お手紙書いてみたよ。"
zh = "制作人，还好吗？跟你说哦，我要去一个有点远的地方了。所以，我试着给你写了封信。"

[[paragraphs]]
ja = "岡山の学校まで会いに来てくれた日、覚えてる？　あの頃のあたし、アイドルのこと、なんにもわかってなかったよね。あはっ。"
zh = "你跑到冈山的学校来见我的那天，还记得吗？那时候的我，对偶像什么都不懂呢。啊哈。"

[[paragraphs]]
ja = "なのに、大きいステージまで連れていってくれて、ケンカした時も、ちゃんとあたしの話を聞いてくれた。すっごく、すっごく嬉しかったんだーっ。"
zh = "可你还是带我站上了大舞台，吵架的时候，也好好听我把话说完了。我真的、真的好开心。"

[[paragraphs]]
ja = "撮影のコツを書いてくれたメモ、向こうにも持っていくね。あたしにとっては、今もずっとお守りなんだ。"
zh = "你写给我的拍照诀窍的那张便条，我也会带过去哦。对我来说，它到现在都是护身符。"

[[paragraphs]]
ja = "[softly, smiling] それでね、会いたくなったら、今度はあたしの方から会いに行くから。それまで、待っててくれる？　……ね？"
zh = "还有啊，等我想见你了，这次换我去见你。在那之前，你会等我吗？……好不好？"
