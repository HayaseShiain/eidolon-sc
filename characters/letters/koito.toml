# 福丸小糸的信
character = "koito"
salutation = "プロデューサーさんへ"
signature = "福丸小糸より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/koito.md「自称」：自称平假名「わたし」，第 1、2、5 段",
  "sheets/koito.md「对他人的称呼」：叫制作人「プロデューサーさん」，从不省掉「さん」；抬头和第 3 段用它",
  "sheets/koito.md「口癖」：对制作人用ですます、句尾带「……！」；第 4 段逞强说「全然よゆーです」；第 5 段内弁慶的「だめだめ」说法",
  "sheets/koito.md「与组合伙伴的关系」：她最怕被大家落下，第 1 段说这次轮到自己先走",
  "facts/koito.md「成为偶像的经过」：第 2 段面试那天制作人给了她第一个课题；第 3 段她瞒着家里来面试，是制作人打电话到她家才和父母谈开",
  "facts/koito.md「第一个课题与它的答案」：第 2 段她的答案是成为能让人找到「居場所」的偶像；第 4 段制作人告诉她能努力也是一种才能",
  "facts/koito.md「制作人」：第 3 段连家人都没说过的话，她能对制作人说",
  "facts/koito.md「自己的名字」：她其实挺喜欢「福丸小糸」这个名字，署名写全名",
]

[[paragraphs]]
ja = "[nervously] 少しのあいだ、遠くへ行くことになりました。置いていかれるのが怖かったのに、今度はわたしが行く番なんて、変な感じです。"
zh = "我要去远一点的地方待一阵子了。明明那么怕被落下，这次却轮到我先走，感觉好奇怪。"

[[paragraphs]]
ja = "面接の日にもらった最初の課題、覚えていますか。誰かの居場所になれるアイドル。あの答えは、今もわたしの宝物です。"
zh = "面试那天你给我的第一个课题，还记得吗？成为能让人找到容身之处的偶像。那个答案，到现在都是我的宝物。"

[[paragraphs]]
ja = "家族にも言えなかったことを、プロデューサーさんには話せました。家に電話をくれた日のこと、ずっと忘れません。"
zh = "连家人都说不出口的话，我却能跟制作人说。你往我家打电话的那天，我会一直记得。"

[[paragraphs]]
ja = "頑張れることも才能だって教えてくれて、本当にありがとうございました。向こうでも、全然よゆーです……！　[pause] ……たぶん。"
zh = "你告诉我能努力也是一种才能，真的非常感谢。到了那边，我也完全游刃有余……！……大概吧。"

[[paragraphs]]
ja = "[trying to sound brave] わたしがいないからって、だめだめにならないでくださいね……！　次に会うとき、ちゃんと確かめますから。"
zh = "我不在，你可不能变得一塌糊涂哦……！下次见面的时候，我会好好检查的。"
