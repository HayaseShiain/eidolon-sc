# 大崎甘奈的信
character = "amana"
salutation = "プロデューサーさんへ"
signature = "甘奈より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/amana.md「自称」：自称「甘奈」",
  "sheets/amana.md「对他人的称呼」：叫制作人「プロデューサーさん」",
  "sheets/amana.md「口癖」：明朗的女高中生口吻，笑声「えへへ」",
  "facts/amana.md「被发掘（S.T.E.P.）」：第 2 段，在车站前看到 283 的招募海报，才去试镜、认识了制作人",
  "facts/amana.md「制作人」：第 2 段，她感谢那张海报让自己和制作人相遇（只取意思，不引原句）",
  "facts/amana.md「G.R.A.D.」：第 3 段，她一个人硬撑，制作人告诉她不必那么「ちゃんと」，她才在他面前哭着说出心里话",
  "sheets/amana.md「身份」：第 3 段，G.R.A.D. 时一个人硬撑着说「大丈夫」，直到在制作人面前哭出来",
  "facts/amana.md「感謝祭（私たちの未来）」：第 4 段，她曾经害怕改变，只想让现在一直持续下去",
  "facts/amana.md「制作人」：第 5 段，她叮嘱制作人好好吃饭，知道他总喝黑咖啡，会帮他挑衣服、搭配私服",
]

[[paragraphs]]
ja = "[brightly] プロデューサーさん、元気？　甘奈ね、ちょっとだけ遠くまで行くことになったんだ。だから、お手紙書いてみたよ。"
zh = "制作人，你还好吗？甘奈要去稍微远一点的地方了。所以，试着给你写了封信。"

[[paragraphs]]
ja = "駅前で事務所のポスターを見つけた日から、ぜんぶ始まったんだよね。プロデューサーさんに会えたのも、あの日のおかげ。"
zh = "一切都是从在车站前看到事务所海报的那天开始的呢。能遇见制作人，也多亏了那一天。"

[[paragraphs]]
ja = "[softly] 大丈夫って言い張ってた甘奈に、無理しなくていいって言ってくれてありがとう。泣いちゃったのは、内緒にしてね。えへへ。"
zh = "甘奈硬说「没事」的时候，谢谢你告诉我不用勉强。哭鼻子的事，要替我保密哦。嘿嘿。"

[[paragraphs]]
ja = "前の甘奈は、変わっちゃうのがすっごく怖かったのにね。今は、知らない景色を見に行くのがちょっと楽しみなんだ。"
zh = "以前的甘奈，明明特别害怕事情会变。现在呢，去看没见过的风景，反而有点期待。"

[[paragraphs]]
ja = "[warmly] ブラックコーヒーだけで済ませないで、ごはんもちゃんと食べてね。帰ってきたら、また甘奈がコーデしてあげる！　約束だよ。"
zh = "别光靠黑咖啡对付，饭也要好好吃哦。等我回来，再帮你搭配衣服！说好了哦。"
