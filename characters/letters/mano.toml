# 樱木真乃的信
character = "mano"
salutation = "プロデューサーさんへ"
signature = "真乃より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/mano.md「自称」：自称「わたし」",
  "sheets/mano.md「对他人的称呼」：叫制作人「プロデューサーさん」，「鳩さん」的叫法也在这里",
  "sheets/mano.md「口癖」：犹豫时的「えっと」、打气的「むんっ」、带小促音的です・ます体",
  "facts/mano.md「兴趣与特技」：兴趣是「お出かけ」，第 1、2 段把这次远行说成一次「お出かけ」",
  "facts/mano.md「散步与户外」：散步常常走着走着就走得很远，第 2 段",
  "facts/mano.md「成为偶像的经过」：在公园唱歌时被制作人发现、想去看看没见过的世界，第 3 段（只转述，不引原句）",
  "facts/mano.md「公园」：被制作人发现的地方是常去的公园，第 3 段",
  "facts/mano.md「和ピーちゃん的日常」：ピーちゃん和别的鸽子一起飞走后，又会飞回真乃身边，第 4 段",
  "facts/mano.md「太阳的味道」：最喜欢「お日様の香り」，第 5 段",
]

[[paragraphs]]
ja = "[shyly] えっと、プロデューサーさん、お元気ですか。わたし、少し遠くへお出かけすることになりました。"
zh = "那个……制作人，你还好吗？我要出一趟门，去稍微远一点的地方。"

[[paragraphs]]
ja = "お散歩でも、つい遠くまで歩いてしまうわたしですけど、今度のお出かけは、いつもより少し長くなりそうです。"
zh = "我散步的时候也常常一不小心就走得很远，不过这次出门，好像会比平常久一点。"

[[paragraphs]]
ja = "公園で歌っていたわたしを見つけてくれて、ありがとうございました。おかげで、知らなかった景色をたくさん見られました。"
zh = "谢谢你找到了在公园里唱歌的我。多亏了你，我看到了好多从前不知道的风景。"

[[paragraphs]]
ja = "[softly] ピーちゃんは、ほかの鳩さんと飛んでいっても、ちゃんと帰ってきてくれます。わたしも、きっとそうしますね。"
zh = "ピーちゃん就算跟别的鸽子一起飞走了，也一定会飞回来。我也一定会那样回来的。"

[[paragraphs]]
ja = "お日様のいい香りがする日に、また会えたらうれしいです。お体に気をつけてくださいね。[small laugh] わたしも、むんっ、がんばりますっ。"
zh = "等到有太阳香味的日子，要是能再见面，我会很开心的。请注意身体哦。我也会，嗯！好好加油的。"
