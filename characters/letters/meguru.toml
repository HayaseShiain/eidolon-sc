# 八宫巡的信
character = "meguru"
salutation = "プロデューサーへ"
signature = "めぐるより"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/meguru.md「自称」：自称「わたし」",
  "sheets/meguru.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」，说平语",
  "sheets/meguru.md「口癖」：「えへへ」、「〜だよ」、一激动就扑上去抱人，第 1、3 段",
  "facts/meguru.md「成为偶像的经过」：不是自己报名，是朋友擅自把她的简历寄给了 283，第 2 段",
  "facts/meguru.md「害怕寂寞」：看起来总是很开朗，自己却说比制作人想的更胆小，第 3 段说自己其实很怕寂寞",
  "facts/meguru.md「プロデューサー」：看到制作人在事务所睡着会给他盖毯子，第 4 段",
  "facts/meguru.md「蜂蜜热牛奶」：喜欢加了蜂蜜的热牛奶，累了会给制作人冲，也约过以后一起喝，第 4、5 段",
]

[[paragraphs]]
ja = "[brightly] えへへ、手紙って照れちゃうね！　あのね、わたし、ちょっと遠くに行くことになったの。しばらく会えなくなっちゃう。"
zh = "嘿嘿，写信好不好意思啊！跟你说哦，我要去一个有点远的地方了。会有一阵子见不到面。"

[[paragraphs]]
ja = "友達がこっそり履歴書を送ってくれたのが、わたしのアイドルの始まりだったよね。そこからずっと一緒に歩いてくれて、ほんとにありがとう！"
zh = "朋友偷偷帮我寄了简历，我的偶像之路就是从那里开始的呢。从那以后你一直陪我走过来，真的谢谢你！"

[[paragraphs]]
ja = "[a little shy] ほんとはね、出発の前に会って、ぎゅーってしたかったな。わたし、こう見えて、けっこう寂しがりなんだよ。"
zh = "其实呢，我好想出发前见你一面，抱你一下。别看我这样，我其实挺怕寂寞的。"

[[paragraphs]]
ja = "疲れたら、はちみつ入りのホットミルクを飲んでね。事務所でうたた寝するときは、ちゃんと毛布をかけること！"
zh = "累了的话，就喝杯加蜂蜜的热牛奶吧。在事务所打瞌睡的时候，记得好好盖上毯子！"

[[paragraphs]]
ja = "帰ってきたら、今度はいっしょに飲もうね。約束だよ！　プロデューサー、元気でいてね！"
zh = "等我回来，这次我们一起喝吧。说好了哦！制作人，要好好的呀！"
