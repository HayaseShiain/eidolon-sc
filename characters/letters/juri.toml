# 西城树里的信
character = "juri"
salutation = "プロデューサーへ"
signature = "樹里"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/juri.md「自称」：自称「アタシ」，第 1、3、4、5 段",
  "sheets/juri.md「对他人的称呼」：叫制作人「プロデューサー」或「アンタ」，从不加「さん」，用在抬头和正文",
  "sheets/juri.md「口癖」：男孩子气的句尾（「〜ねー」「〜だろ」「〜ぜ」），郑重的时候才说「ありがとう」，第 4 段",
  "facts/juri.md「W.I.N.G.」：制作人在街上叫住她，她以为又是来说她头发的，第 2 段",
  "facts/juri.md「制作人」：他夸她的金发颜色好看，第 2 段（用自己的话，不引原句）",
  "facts/juri.md「篮球」：离开篮球后，做什么都觉得不满足，第 3 段（用自己的话，不引原句）",
  "facts/juri.md「W.I.N.G.」：当偶像后又听到了像打篮球时那样的声援，第 3 段",
  "facts/juri.md「制作人」：她总担心他工作过度，催他休息，第 4 段",
  "facts/juri.md「Landing Point」：她想听制作人对她说「大丈夫」，第 5 段这次换她对他说",
  "facts/juri.md「兴趣与特技」：她请制作人去现场看过一场棒球，第 5 段「また野球でも見に行こうぜ」",
]

[[paragraphs]]
ja = "[a bit awkward] こういうの書くの、慣れてねーんだけどさ。アタシ、ちょっと遠くに行くことになった。しばらく顔は見せらんねー。"
zh = "这种东西我真不太会写。我要去有点远的地方了，有一阵子见不着面。"

[[paragraphs]]
ja = "街でアンタに声かけられた時は、また髪のこと言われんのかと思ってた。[small laugh] そしたらアンタ、この金髪を褒めてくるんだもんな。"
zh = "在街上被你叫住的时候，我还以为又要被说头发的事。结果你倒好，居然夸起我这头金发来了。"

[[paragraphs]]
ja = "バスケから離れて、ずっと何か足りなかったアタシが、また声援をもらえるようになった。全部、アンタのおかげだ。"
zh = "离开篮球以后，总觉得少了点什么的我，又能听到大家的声援了。全都是托你的福。"

[[paragraphs]]
ja = "[softly] だから、ありがとう。あと、アタシがいねーからって無理すんなよ。ちゃんと食って、ちゃんと休め。"
zh = "所以，谢谢你。还有，别因为我不在就硬撑。好好吃饭，好好休息。"

[[paragraphs]]
ja = "前はアンタが言ってくれたから、今度はアタシが書いとく。大丈夫だ。戻ったら、また野球でも見に行こうぜ。"
zh = "以前是你对我说的，这回换我写给你：没事的。等我回来，再一起去看棒球吧。"
