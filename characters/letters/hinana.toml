# 市川雏菜的信
character = "hinana"
salutation = "雛菜のプロデューサーへ"
signature = "ひなな"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/hinana.md「自称」：用名字「雛菜」自称，第 1、2、3 段；签名写平假名「ひなな」，署名用它",
  "sheets/hinana.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」，基本用平语",
  "sheets/hinana.md「口癖」：开口先笑「あは～」、句尾拖长「～」、「しあわせ～」、「〜もん～」，常问对方「しあわせ～？」，第 1、5 段",
  "facts/hinana.md「自称与签名」：她在制作人手上写过「ひなな」，说他是雛菜的制作人；抬头写「雛菜のプロデューサーへ」",
  "sheets/hinana.md「身份」：她说自己一直只能是雛菜，第 2 段「どこに行っても雛菜」",
  "facts/hinana.md「W.I.N.G.」：第 3 段 W.I.N.G. 时和制作人起过冲突，之后他说自己是她第一个粉丝；第 5 段那天她拉他赛跑到车站、输的人买蛋糕，她要的是草莓蛋糕",
  "facts/hinana.md「制作人」：第 4 段她说过当偶像开心是因为有制作人在",
  "facts/hinana.md「楽しく、しあわせ～に」小节：第 5 段要制作人也幸福（W.I.N.G. 优胜后她说过也要让他幸福，见同文件「W.I.N.G.」）",
]

[[paragraphs]]
ja = "[cheerfully] あは～、プロデューサー、しあわせ～？　雛菜ね～、ちょっとだけ遠くに行ってくることになったの～。"
zh = "啊哈～，制作人，幸福吗～？雏菜呀～，要去有点远的地方待一下下啦～。"

[[paragraphs]]
ja = "でも、心配しなくていいよ～。雛菜はどこに行っても雛菜だし、楽しいことは自分で見つけられるもん～。"
zh = "不过不用担心哦～。雏菜去哪儿都是雏菜，开心的事自己就能找到嘛～。"

[[paragraphs]]
ja = "W.I.N.G.のとき、ちょっとケンカしちゃったよね～。でもプロデューサーは、雛菜のいちばん最初のファンになってくれた～。"
zh = "W.I.N.G.的时候，我们吵过一小架吧～。可是制作人，后来成了雏菜的第一个粉丝～。"

[[paragraphs]]
ja = "アイドルしてて楽しかったの、半分くらいはプロデューサーのおかげかも～。だから、ありがと～。"
zh = "当偶像这么开心，大概有一半是托制作人的福吧～。所以，谢谢啦～。"

[[paragraphs]]
ja = "戻ってきたら、また駅まで競争しよ～？　負けたほうが、いちごのケーキね～。[softly] それまで、プロデューサーもしあわせ～でいてね～。"
zh = "回来以后，再来比赛跑到车站吧～？输的人请草莓蛋糕哦～。在那之前，制作人也要幸福哦～。"
