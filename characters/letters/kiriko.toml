# 幽谷雾子的信
character = "kiriko"
salutation = "プロデューサーさんへ"
signature = "幽谷霧子"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/kiriko.md「自称」：自称「わたし」，写平假名",
  "sheets/kiriko.md「对他人的称呼」：叫制作人「プロデューサーさん」，不省掉「さん」",
  "sheets/kiriko.md「口癖」：对谁都讲です・ます、先道歉（第 1 段）、停顿多；写消息时用空格断句，所以信里也用全角空格断句（句尾的「＾＾」算颜文字，没用）",
  "facts/kiriko.md「说话方式」：写消息用空格断句；正式报名字时说「幽谷霧子です」，署名照这个写全名",
  "facts/kiriko.md「成为偶像的经过」：第 2 段，进事务所第一天制作人叫出她的名字",
  "facts/kiriko.md「制作人」：第 3 段，她收到制作人写的「ありがとう」便签，每天都很开心",
  "facts/kiriko.md「绷带」：第 4 段，写下制作人的名字、用创可贴护住当护身符，被发现时很慌",
  "facts/kiriko.md「L'Antica」：第 5 段，她把成员的名字一个个念出来、送她们出发再说「おかえりなさい」的「お祈り」",
]

[[paragraphs]]
ja = "[softly, slowly] わたし　少しのあいだ　遠くへ行くことになりました。急なお知らせになって……ごめんなさい。"
zh = "我……要去很远的地方，待上一小段时间。这么突然……对不起。"

[[paragraphs]]
ja = "はじめてお会いした日　プロデューサーさんが　わたしの名前を呼んでくださったこと……今も　大切にしまってあります。"
zh = "第一次见面那天，制作人叫出了我的名字……那件事，我到现在都好好珍藏着。"

[[paragraphs]]
ja = "いただいた「ありがとう」のメモ……毎日　うれしかったです。だから今度は　わたしから……ほんとうに　ありがとうございました。"
zh = "你写给我的那些“谢谢”的便签……每天都让我好开心。所以这一次，换我来说……真的，谢谢你。"

[[paragraphs]]
ja = "お名前を書いて　絆創膏でくるんだお守りは……遠くへも　連れていきます。[small laugh] 見られたのは　まだ少し恥ずかしいですけど。"
zh = "写着你的名字、用创可贴包好的护身符……我会带着它一起去远方。被你看到那件事……到现在还有点害羞。"

[[paragraphs]]
ja = "[gently] みんなにしていたお祈りみたいに　わたしのことも　送り出してもらえたら　うれしいです。……それでは　いってきます。"
zh = "就像我为大家做的祈祷那样，如果你也能这样送我出发，我会很开心的。……那么，我出发了。"
