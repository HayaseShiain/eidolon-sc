# 芹泽朝日的信
character = "asahi"
salutation = "プロデューサーさんへ"
signature = "芹沢あさひ"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/asahi.md「自称」：自称「わたし」",
  "sheets/asahi.md「对他人的称呼」：叫制作人「プロデューサーさん」，叫伙伴「冬優子ちゃん」「愛依ちゃん」",
  "sheets/asahi.md「口癖」：句尾「〜っす」「ありがとっす」，常说「面白い」「ワクワクする」",
  "sheets/asahi.md「身份」：工作时报全名「芹沢あさひ」，用作署名；总在找「面白い」的东西，第 5 段用",
  "facts/asahi.md「喜欢的东西」：不知道会出现什么反而让她兴奋，第 1 段的口气由此来",
  "facts/asahi.md「好奇心与「ひとり」」：以前一个人找乐子，第 2 段提到",
  "facts/asahi.md「W.I.N.G.」：当偶像以后不再是一个人，第 2 段提到（用自己的话，不引原句）",
  "facts/asahi.md「制作人」：她拉着他到处跑、他在后面追，第 2 段；只给制作人、冬優子、愛依设了专属铃声，第 4 段",
  "facts/asahi.md「S.T.E.P.」：制作人说要当她的「地图」，第 3 段提到",
  "facts/asahi.md「何もないステージ（Wintermute,dawn）」：包里一直放着指南针，第 3 段提到",
  "characters.toml asahi 的 greeting：开口就问有没有好玩的事，第 5 段反过来托制作人找",
]

[[paragraphs]]
ja = "[brightly] しばらく、ちょっと遠くまで行ってくるっす。どんなところか知らないから、ワクワクするっす。"
zh = "我要去稍微远一点的地方，会走一阵子。那是什么样的地方我也不知道，所以挺期待的。"

[[paragraphs]]
ja = "前は、面白いことはひとりで探してたっす。でも、アイドルになったら、プロデューサーさんが追いかけてきてくれたっすね。"
zh = "以前，好玩的事都是我一个人去找。可当上偶像以后，制作人总会追在我后面跟过来呢。"

[[paragraphs]]
ja = "プロデューサーさんが地図になってくれたこと、覚えてるっす。コンパスもカバンにあるから、迷わないっす。"
zh = "制作人说要当我的地图，我都记得。包里也有指南针，所以不会迷路的。"

[[paragraphs]]
ja = "冬優子ちゃんと愛依ちゃんと、プロデューサーさんからの電話は、特別な音にしてあるっす。どこでも、鳴ったらすぐわかるっす。"
zh = "冬优子、爱依，还有制作人打来的电话，我都设了专门的铃声。不管在哪儿，一响我马上就知道。"

[[paragraphs]]
ja = "[smiling] 今まで、ありがとっす！　帰ったら、見つけた面白いこと全部話すっす。プロデューサーさんも、なんか面白いこと探しといてほしいっす。"
zh = "一直以来，谢谢啦！等我回来，要把找到的好玩的事全都讲给你听。制作人也帮我找找有什么好玩的吧。"
