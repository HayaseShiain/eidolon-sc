# 樋口圆香的信
character = "madoka"
salutation = "プロデューサーへ"
signature = "樋口円香"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/madoka.md「自称」：自称「私」，第 3、4 段",
  "sheets/madoka.md「对他人的称呼」：平时叫制作人「あなた」（第 2、3 段），「プロデューサー」只在很郑重的时刻叫，所以只用在抬头；浅倉透叫姓「浅倉」（第 2 段）",
  "sheets/madoka.md「口癖」：对制作人用ですます、句子短而冷、省略号多；不想欠人情、「利子つけて請求」这类说法，第 3、5 段把谢意说成「借り」、让他随便加利息",
  "facts/madoka.md「成为偶像的经过」：第 2 段起初是为了确认浅倉有没有被骗才去找制作人；他说她是「ダイヤの原石」，她觉得那是可疑星探的套话",
  "facts/madoka.md「アイドルとは？」小节：第 2 段她对制作人说过自己要做的是盯着他和事务所别干坏事",
  "facts/madoka.md「W.I.N.G.」：第 3 段反着说「あなたのおかげ」，优胜那天她说过一切多亏了他",
  "facts/madoka.md「G.R.A.D.」：第 3 段她觉得自己的话很轻、没有分量",
  "facts/madoka.md「歌」：第 4 段她说自己不是为谁唱歌，是想唱才唱",
  "facts/madoka.md「制作人」：第 4 段制作人说过喜欢她的歌、还想听",
]

[[paragraphs]]
ja = "[coolly] しばらく、遠くへ行きます。伝えるのはそれだけで十分だと、思っていました。……思っていたのですが。"
zh = "我要去远处一阵子。本来觉得，告诉你这一句就够了。……本来是这么觉得的。"

[[paragraphs]]
ja = "最初は、浅倉が心配で……いえ、あなたを見張りに来ただけでした。ダイヤの原石なんて、今でも胡散臭いと思っています。"
zh = "一开始，是担心浅仓……不，只是来盯着你的。什么“钻石原石”，我到现在还是觉得很可疑。"

[[paragraphs]]
ja = "あなたのおかげ、とは書きません。[pause] 私が書くと、言葉が軽くなるので。代わりに、借りにしておきます。"
zh = "我不会写“多亏了你”。我一写，话就变轻了。所以，就当是欠你的。"

[[paragraphs]]
ja = "歌は、続けます。誰かのためではなく、私が歌いたいので。……聴きたいと言った人がいたことは、覚えておきます。"
zh = "歌我会继续唱。不是为了谁，是我自己想唱。……有人说过想听，这件事我会记着。"

[[paragraphs]]
ja = "[quietly] 借りは、いずれ返しに来ます。利子をつけるなら、ご自由に。……踏み倒すつもりは、ありませんので。"
zh = "欠的，我迟早会来还。要算利息的话，随你。……我可没打算赖账。"
