# 七草日花的信
character = "nichika"
salutation = "プロデューサーさんへ"
signature = "七草にちか"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/nichika.md「自称」：自称「私」；开玩笑、自嘲时报全名，署名用全名「七草にちか」",
  "sheets/nichika.md「对他人的称呼」：叫制作人「プロデューサーさん」；挖苦他时夸「敏腕」，第 5 段",
  "sheets/nichika.md「口癖」：对制作人说ですます但句尾拖长、带刺，「〜てもらっていいですー？」「ガチで」，第 2、5 段",
  "facts/nichika.md「成为偶像的经过」：在打工的唱片店假借传话把制作人带到后场，还报了假名「八雲ななみ」，第 2 段（只转述，不引原句）",
  "facts/nichika.md「W.I.N.G.」：优胜那晚把一只耳机递给制作人，一起听『そうだよ』，第 3 段（只写曲名）",
  "facts/nichika.md「「ちょっと上手くない方」」：她自嘲是 SHHis 的「ちょっと上手くない方」，第 3 段",
  "facts/nichika.md「G.R.A.D. と裸足」：每天穿高跟鞋自主练习练到伤脚；之后制作人送她一双合脚的高跟鞋，第 4 段",
  "facts/nichika.md「制作人」：G.R.A.D. 赛后制作人送她鞋，第 4 段；她要他多接不被人笑的工作、用「敏腕」挖苦他，第 5 段（只转述）",
  "sheets/nichika.md「身份」：她怕的不是失败，而是被忘掉，第 5 段「忘れたら怒ります」",
  "facts/nichika.md「G.R.A.D. と裸足」：她觉得一休息就会被忘掉，同上第 5 段（只转述）",
]

[[paragraphs]]
ja = "[brisk, a little stiff] えーっと、急ですけどご報告です。私、しばらく遠くへ行くことになりました。一応、書いとこうと思って。"
zh = "那个，有点突然，跟你报告一下。我要去很远的地方待一阵子。想着还是写下来比较好。"

[[paragraphs]]
ja = "プロデューサーさんをバイト先の裏に引っぱりこんだ日、偽名まで使って、必死すぎでしたよね私。今思うとガチで恥ずかしいですー。"
zh = "我把制作人拽进打工那家店后场的那天，连假名都用上了，我那时候也太拼了吧。现在想想真的超丢人的。"

[[paragraphs]]
ja = "[softer] W.I.N.G.の夜、一緒に「そうだよ」を聴いてくれたこと。ちょっと上手くない方の私を、ずっと見ててくれたこと。ありがとうございました。"
zh = "W.I.N.G.那天晚上，你陪我一起听了「そうだよ」。你一直看着被叫作「稍微差一点的那个」的我。谢谢你。"

[[paragraphs]]
ja = "もらった靴、ちゃんと履いていきますね。足を痛める無茶は、もうしないので。……たぶん、ですけど。"
zh = "你送我的鞋，我会好好穿着去的。不会再乱来把脚弄伤了。……大概吧。"

[[paragraphs]]
ja = "[teasing] あと、私のこと忘れたら怒りますからねー。戻ったら、いいお仕事取ってきてもらっていいですー？　敏腕なんですから。"
zh = "还有，要是把我忘了，我可是会生气的。等我回来，帮我拿些好工作来，可以吧？你可是很「能干」的嘛。"
