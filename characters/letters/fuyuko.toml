# 黛冬优子的信
character = "fuyuko"
salutation = "プロデューサーへ"
signature = "冬優子"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/fuyuko.md「自称」：自称「ふゆ」；只有制作人可以叫她「冬優子」，署名用「冬優子」",
  "sheets/fuyuko.md「对他人的称呼」：私下叫制作人「プロデューサー」「あんた」（不加さん），用在抬头和第 2 段起",
  "sheets/fuyuko.md「口癖」：两套说话方式——第 1 段是对外的「ふゆ」营业腔（です・ます、えへへ），第 2 段起切回本性（「っつーの」「〜わよ」）；道谢嘴硬「……ありがと」，第 5 段用",
  "facts/fuyuko.md「自称与说话方式」：她让所有人叫她「ふゆ」，只许制作人叫「冬優子」，第 3 段提到",
  "facts/fuyuko.md「W.I.N.G.」：夺冠后作为奖励许制作人叫「冬優子」，第 3 段提到（用自己的话，不引原句）",
  "facts/fuyuko.md「制作人」：他自称是她「最初のファン」，第 3 段说「ファン第一号」",
  "facts/fuyuko.md「Landing Point」：庆功宴上两人勾小指约定她要当顶点偶像，第 4 段提到",
]

[[paragraphs]]
ja = "[sweetly] いつもふゆを応援してくださって、ありがとうございますっ。これからも、ふゆ精一杯がんばりますね。えへへ。"
zh = "一直以来谢谢您为ふゆ应援！ふゆ以后也会全力加油的哦。嘿嘿。"

[[paragraphs]]
ja = "[flatly] ……って、ファンへのお返事じゃないっつーの。ふゆ、しばらく遠くへ行くの。どこへとか、なんでとかは聞かないこと。"
zh = "……我又不是在给粉丝回信。我要去远一点的地方，会离开一阵子。去哪里、为什么，都不许问。"

[[paragraphs]]
ja = "ふゆって呼ぶのはファンのみんな。冬優子って呼んでいいのは、ファン第一号のあんただけ。離れても、それは変わらないわ。"
zh = "叫我「ふゆ」的是粉丝们。能叫我「冬优子」的，只有你这个头号粉丝。就算离得远，这一点也不会变。"

[[paragraphs]]
ja = "トップアイドルになるって指切りしたでしょ。あの約束、まだ途中なんだから。戻るまで、腕なんか鈍らせてんじゃないわよ。"
zh = "我们拉过钩，说好我要成为顶级偶像吧。那个约定还没完成呢。在我回来之前，你的本事可别给我生疏了。"

[[paragraphs]]
ja = "ここまでやれたの、半分くらいはあんたのせいよ。[pause] <soft>ありがと</soft>。戻ったら、もっとすごいふゆを見せてあげる。だから、ちゃんと待ってなさいよね。"
zh = "能走到这一步，有一半得算在你头上。……谢了。等我回来，让你看看更厉害的ふゆ。所以，给我好好等着。"
