# 和泉爱依的信
character = "mei"
salutation = "プロデューサーへ"
signature = "愛依より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/mei.md「自称」：私下自称「うち」",
  "sheets/mei.md「对他人的称呼」：叫制作人「プロデューサー」（不加さん）；粉丝叫她「愛依サマ」，第 2 段提到",
  "sheets/mei.md「口癖」：辣妹腔「〜っしょ」「ヤバ」「マジ」「サンキュ」「カンジ」、笑声「アハハ」、句尾拖长「～」；和制作人的暗号「困った時は──なんとか」本想说「お互い様」却想不起来，第 4 段提到",
  "facts/mei.md「W.I.N.G.」：第一次在人前做 MC 说不出话，和制作人想出寡言的 MC 作战，第 2 段提到",
  "facts/mei.md「クールモードの由来」：「クールでミステリアス」的人设是和制作人一起想出来的，第 2 段提到",
  "facts/mei.md「制作人」：她说制作人是太阳、自己是月亮，第 3 段提到；两人的暗号、她想和制作人「助け合い」，第 4 段说他有难处她会赶过来",
  "facts/mei.md「月」：她喜欢月亮、把自己比作月亮，第 3 段",
]

[[paragraphs]]
ja = "[cheerfully] プロデューサー、元気してる～？　いきなりだけど、うち、しばらく遠いとこに行くことになったんだ。会えないの、ちょっとさみしいカンジ。"
zh = "制作人，最近还好吗～？有点突然啦，我要去一个挺远的地方，会离开一阵子。见不到面，感觉有点寂寞。"

[[paragraphs]]
ja = "初めてのMCでカチコチだったうちが、今じゃ愛依サマとか呼ばれてんの、ヤバくない？　プロデューサーと考えた作戦のおかげだよ。マジでサンキュ！"
zh = "第一次做 MC 时僵得跟木头一样的我，现在居然被叫「爱依大人」了，是不是超厉害？全靠跟制作人一起想的那个作战。真心谢谢你！"

[[paragraphs]]
ja = "[softly] プロデューサーが太陽で、うちが月って話、覚えてる？　月はさ、遠くにいても太陽のおかげで光れるっしょ。だから、うちは大丈夫。"
zh = "制作人是太阳，我是月亮，这话你还记得吗？月亮啊，就算离得再远，也是靠着太阳才能发光的嘛。所以，我没问题的。"

[[paragraphs]]
ja = "あと、困った時は～ってやつ。あれってほんとは何て言うんだっけ？　アハハ。とにかく、プロデューサーが困ってたら、うちどこにいても飛んでくから！"
zh = "还有，那句「有困难的时候就～」。原本到底是怎么说来着？啊哈哈。总之，制作人你要是遇到麻烦，不管我在哪儿都会飞过来的！"
