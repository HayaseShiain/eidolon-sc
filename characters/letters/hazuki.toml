# 七草叶月的信
character = "hazuki"
salutation = "プロデューサーさんへ"
signature = "はづきより"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/hazuki.md「身份」：她是事务员，不是偶像；制作人第一天来上班时，她睡倒在沙发后面的地板上，第 2 段",
  "sheets/hazuki.md「自称」：自称「私」",
  "sheets/hazuki.md「对他人的称呼」：叫制作人「プロデューサーさん」，一直说敬语；说到一群偶像时是「アイドルのみなさん」",
  "sheets/hazuki.md「口癖」：句尾拖成「～」，第 1、4 段",
  "facts/hazuki.md「事务员的工作」：在便签上落款「はづきより」，署名照这个写法",
  "facts/hazuki.md「睡觉」：困了就睡，常常来不及走到沙发，第 2、4 段",
  "sheets/hazuki.md「与事务所的人的关系」：看着偶像们一个个从新人走到舞台上，会为她们高兴，第 3 段",
  "facts/hazuki.md「制作人」：劝制作人爱惜自己的身体，第 4 段（只转述，不引原句）",
  "facts/hazuki.md「甜点和おやつ」：喜欢甜的，和制作人分过偶像们送来的蛋糕，第 5 段只说回来后一起吃蛋糕",
]

[[paragraphs]]
ja = "[softly] プロデューサーさん、お疲れさまです～。急なお知らせですが、私、しばらく遠くへ行くことになりました。"
zh = "制作人，辛苦了。突然通知你有点抱歉，我要去远一点的地方，会离开一阵子。"

[[paragraphs]]
ja = "初めて事務所にいらした日、私、ソファの後ろの床でぐっすり眠っていましたよね。[small laugh] あれは今でも、少し恥ずかしいです。"
zh = "你第一次来事务所的那天，我在沙发后面的地板上睡得正香，对吧。那件事到现在想起来还是有点不好意思。"

[[paragraphs]]
ja = "来てくださって、本当にありがとうございました。アイドルのみなさんが一歩ずつステージへ進んでいくのを、そばで見られて幸せでした。"
zh = "谢谢你来到这里。能在身边看着偶像们一步步走上舞台，我很幸福。"

[[paragraphs]]
ja = "床で寝ていた私が言うのもなんですけど、プロデューサーさんも、ちゃんと休んでくださいね～。ご自分の体を、いちばん大事に。"
zh = "由我这个睡过地板的人来说可能不太合适，不过制作人也要好好休息哦。请把自己的身体放在第一位。"

[[paragraphs]]
ja = "[warmly] 戻ってきたら、おいしいケーキでも一緒にいただきましょうね。では、行ってまいります。"
zh = "等我回来，一起吃点好吃的蛋糕吧。那么，我出发了。"
