# 郁田阳希的信
character = "haruki"
salutation = "プロデューサーさんへ"
signature = "郁田はるき"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/haruki.md「自称」：自称「わたし」；工作场合报全名「郁田はるきです」，署名用全名",
  "sheets/haruki.md「对他人的称呼」：叫制作人「プロデューサーさん」，从不省掉「さん」",
  "sheets/haruki.md「口癖」：对制作人说です・ます，句尾拖长的「～なぁ」，笑声「ふふ」，爱说「見たい」「描く」「まだまだ」，第 3、4、5 段",
  "facts/haruki.md「制作人」：她想象过他有一天不再出现，请他「突然いなくなったりなんて、しないでくださいね？」，第 1 段反过来说这次是自己要走（只转述）",
  "facts/haruki.md「名字」：小时候不喜欢自己的名字，因为制作人常叫她而喜欢上了，第 2 段（只转述，不引原句）",
  "facts/haruki.md「卡片里的工作与日常」：【連綿と、桜】工作后错过一班电车，制作人带她去看晚开的樱花，第 3 段（只转述她当时的感想，不引原句）",
  "facts/haruki.md「兴趣与特技」：特技是画画，给制作人画过速写和肖像，第 4 段",
  "facts/haruki.md「喜欢的东西」：画画、看（「見ることが、とてもとても好き」），第 4、5 段",
]

[[paragraphs]]
ja = "[softly] 前に、急にいなくならないでくださいねって、お願いしましたよね。なのに今度は、わたしの方が遠くへ行くことになっちゃいました。"
zh = "以前我拜托过你，别突然不见了，对吧。可这次，反倒是我要去很远的地方了。"

[[paragraphs]]
ja = "はるき、って何度も呼んでもらううちに、この名前が、ちゃんと好きになれました。わたしの大切な宝物です。"
zh = "被你一次次地叫着「阳希」，我终于真正喜欢上了这个名字。这是我很珍贵的宝物。"

[[paragraphs]]
ja = "電車に乗り遅れた日、遅咲きの桜を見せてくれましたよね。遅れても、追いかけていれば、ちゃんと会えるものがあるんだなぁって思いました。"
zh = "那天我错过了电车，你带我去看了晚开的樱花，对吧。那时我就想，就算晚了一步，只要一直追着，总会遇见的。"

[[paragraphs]]
ja = "行った先でも、たくさん見て、たくさん描こうと思います。いつか、その絵を見てもらえたら嬉しいです。"
zh = "到了那边，我也想多看看、多画画。哪天能把那些画拿给你看，我会很开心的。"

[[paragraphs]]
ja = "[warmly] だから、また会えた時は、続きを一緒に見に行きましょうね。まだまだ、見たい景色がいっぱいあるんです。ふふ。"
zh = "所以，等再见面的时候，我们一起去看后面的风景吧。我想看的风景，还多着呢。"
