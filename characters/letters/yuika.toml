# 三峰结华的信
character = "yuika"
salutation = "Ｐたんへ"
signature = "三峰より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/yuika.md「自称」：平时自称「三峰」（第 1、2、5 段、署名），认真、动情时换成「私」（第 4 段）",
  "sheets/yuika.md「对他人的称呼」：随意、撒娇时叫制作人「Ｐたん」（抬头、第 3 段），平时叫「プロデューサー」（第 4 段）",
  "sheets/yuika.md「口癖」：「さーて」「〜かな」「なんてね」式的玩笑，对制作人一律平语",
  "facts/yuika.md「上京与出道经过」：第 2 段，下雨天抱着周边在街角躲雨时被制作人叫住",
  "sheets/yuika.md「身份」：第 2 段，进这一行前是坐在台下看的那一个；被挖角时想当一回「主人公」（换成自己的话）",
  "facts/yuika.md「制作人」：第 3 段，制作人说自己是粉丝第一号、她说家人在前面，两人为此争过；她拿他当「相棒」",
  "facts/yuika.md「自我认知与性格」：第 4 段，对自己的评价低",
  "facts/yuika.md「眼镜」：第 5 段，她给制作人留的作业：想想哪副眼镜最适合三峰",
  "facts/yuika.md「雨天」：第 5 段，雨天对她特别（和制作人初次见面那天下着雨），也跟他约过下雨天再一起出门",
]

[[paragraphs]]
ja = "[playfully] さーて、何から書こうかな。……よし、本題！　三峰、しばらく遠くに行くことになりました。急でごめんね。"
zh = "好啦，从哪儿开始写呢。……好，说正事！三峰要去很远的地方待一阵子了。这么突然，抱歉啦。"

[[paragraphs]]
ja = "雨宿りしてたあの日、声をかけてもらわなかったら、三峰は客席側の人のままだったと思う。主人公になりたいって思えたのも、あの日のおかげ。"
zh = "那天我在躲雨，要是没被你叫住，三峰大概还是坐在台下的那个人吧。能想着自己也要当一回主角，也是多亏了那一天。"

[[paragraphs]]
ja = "ファン第一号の座は、まだ家族と争ってもらうとして……相棒の席は、Ｐたんで決まりかな。[small laugh] なんてね。"
zh = "粉丝一号的位子，还请你继续跟我家人争吧……至于搭档的位子，就定是P酱你了。开玩笑的啦。"

[[paragraphs]]
ja = "[sincerely] 私、自分のことはなかなか認められないけど、プロデューサーと積み重ねてきた日々だけは、胸を張って自慢できる。ありがとう。"
zh = "我啊，总是没办法认可自己，可是和制作人一起一点点攒下来的那些日子，我能挺起胸膛拿来骄傲。谢谢你。"

[[paragraphs]]
ja = "そうそう、三峰に一番似合うメガネの宿題、まだ有効だからね。答え合わせは、また雨の日にでも。"
zh = "对了，三峰最适合哪副眼镜的那道作业，现在也还算数哦。对答案的事，就留到哪个下雨天吧。"
