# 月冈恋钟的信
character = "kogane"
salutation = "プロデューサーへ"
signature = "恋鐘より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/kogane.md「自称」：自称「うち」",
  "sheets/kogane.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」；署名用制作人叫她的「恋鐘」",
  "sheets/kogane.md「口癖」：长崎方言的「〜と」「〜けん」「〜せんば」「〜か」形容词、「〜ば」等，全信照用",
  "facts/kogane.md「上京与出道前」：第 2 段，试镜屡屡落选、最后在 283 被制作人选中",
  "facts/kogane.md「制作人」：第 3 段，担心制作人不好好吃饭，在事务所做了一整桌老家食堂的菜等他回来",
  "facts/kogane.md「学校与家庭」：第 3 段「うちの食堂」指老家的つきおか食堂",
  "facts/kogane.md「故乡长崎」：第 4 段，有一天回长崎开凯旋演唱会的目标",
  "facts/kogane.md「拿手菜与家乡味」：第 5 段，她认定的招牌菜ちゃんぽん",
  "facts/kogane.md「料理」：第 5 段，最喜欢看别人吃饱后满足的样子",
]

[[paragraphs]]
ja = "[brightly] プロデューサー、元気にしとる？　うち、しばらく遠かところに行くことになったと。黙って行くとは、うちの性に合わんけんね。"
zh = "制作人，你还好吗？我呀，要去很远的地方待上一阵子。一声不吭就走，可不是我的作风。"

[[paragraphs]]
ja = "オーディションに落ちてばっかりのうちば選んでくれて、[a little shy] ずっとそばにおってくれて、ほんとにありがとう。"
zh = "你选中了试镜总是落选的我，又一直陪在我身边，真的谢谢你。"

[[paragraphs]]
ja = "うちがおらんでも、ご飯はちゃんと食べんばよ？　忙しかけんって抜いたらいかんけんね。うちの食堂の味、たまには思い出してほしか。"
zh = "就算我不在，饭也要好好吃哦？可不能因为忙就不吃。我家食堂的味道，偶尔也要想起来呀。"

[[paragraphs]]
ja = "長崎で凱旋ライブばする夢、うちはまだ諦めとらんよ。プロデューサーと一緒に叶えるって、決めとるけんね。"
zh = "回长崎开凯旋演唱会的梦想，我还没放弃哦。我早就决定了，要和制作人一起实现它。"

[[paragraphs]]
ja = "[warmly] 今度会うときは、うちの自慢のちゃんぽんで、お腹いっぱいにしちゃるけん。楽しみに待っとってね！"
zh = "下次见面的时候，我要用我最拿手的强棒面让你吃得饱饱的。好好期待着吧！"
