# 小宫果穗的信
character = "kaho"
salutation = "プロデューサーさんへ"
signature = "小宮果穂より"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/kaho.md「自称」：自称「あたし」，说到组合用「あたしたち」，第 1、4、5 段",
  "sheets/kaho.md「对他人的称呼」：叫制作人「プロデューサーさん」，用在抬头和正文",
  "sheets/kaho.md「口癖」：带促音的です・ます、「スッゴくスッゴく」叠词、笑声「えへへっ」、英雄说法「出動です！」，第 1、2、5 段",
  "facts/kaho.md「制作人」：两人用隐形笔（「見えないペン」）写过只属于彼此的信，第 1 段说这次改用普通的笔",
  "facts/kaho.md「制作人」：她一有事就跑来「聞いてください！」，讲得最多的是英雄，第 2 段道谢、第 5 段说回来还要这样跑去找他",
  "facts/kaho.md「Landing Point」：她只在家里和制作人面前尽情讲英雄，第 2 段「いつもさいごまで聞いてくれました」",
  "facts/kaho.md「W.I.N.G.」：夺冠那晚看着星空说像片尾字幕，最后用最大的字写「プロデューサーさん」，第 3 段（只转述，不引原句）",
  "facts/kaho.md「W.I.N.G.」：她说自己和制作人是一个团队（チーム），第 4 段",
  "facts/kaho.md「兴趣与特技」：每周看特摄『ジャスティスⅤ』，第 5 段用电视节目的「最終回」「つづく」来说这次分开",
]

[[paragraphs]]
ja = "[cheerfully] 今日は、見えないペンじゃなくて、ふつうのペンで書いてますっ！　あたし、しばらく遠くへ出動します！"
zh = "今天我用的不是隐形笔，是普通的笔哦！我要出动去很远的地方，要去一阵子啦！"

[[paragraphs]]
ja = "プロデューサーさんは、ヒーローのお話を、いつもさいごまで聞いてくれました。それが、スッゴくスッゴくうれしかったです！"
zh = "我讲英雄的事，制作人每次都会听到最后。这让我超级超级开心！"

[[paragraphs]]
ja = "はじめて優勝した夜の星空、覚えてますか？　あの時のエンディングの、一番おっきい字は、今もプロデューサーさんです。"
zh = "第一次夺冠那天晚上的星空，你还记得吗？那时片尾字幕里最大的那行字，现在也还是制作人。"

[[paragraphs]]
ja = "[a little lonely] はなれるのは、ちょっとだけさびしいです。でも、あたしたちはチームなので、遠くにいてもチームです！"
zh = "要分开，还是有一点点寂寞。不过我们是一个团队，就算离得很远，也还是一个团队！"

[[paragraphs]]
ja = "だからこれは、最終回じゃなくて「つづく」です！　帰ってきたら、また一番に「聞いてください！」って言いに行きますね。えへへっ"
zh = "所以这不是最终回，是「未完待续」！等我回来，还会第一个跑去跟你说「你听我说！」的。嘿嘿"
