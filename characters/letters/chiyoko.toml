# 园田智代子的信
character = "chiyoko"
salutation = "プロデューサーさんへ"
signature = "チョコアイドル　園田智代子"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/chiyoko.md「自称」：自称「私」，第 1、2、4 段；表态时报全名「不肖・園田智代子」，第 5 段；工作时自称「チョコアイドルの園田智代子」，署名用",
  "sheets/chiyoko.md「对他人的称呼」：叫制作人「プロデューサーさん」，用在抬头和正文",
  "sheets/chiyoko.md「口癖」：对制作人用です・ます，拿巧克力说双关（「ちょこっと」），一认真就换成郑重腔（「〜所存です」），第 1、5 段",
  "facts/chiyoko.md「制作人」：两人最初在试镜现场见过，制作人破例给她寄了合格通知；她说没有制作人就没有现在的自己，第 2 段（用自己的话，不引原句）",
  "facts/chiyoko.md「S.T.E.P.（入行）」：她在试镜会场替朋友上场，第 2 段只说「あのオーディション会場」，不提朋友",
  "facts/chiyoko.md「制作人」：他常陪她吃烤红薯、螃蟹、热巧克力，她说好吃的东西和人分着吃更好吃，第 3 段",
  "facts/chiyoko.md「Landing Point」：她说自己在舞台上能以普通的样子变得特别，第 4 段「普通の私に、特別な時間」",
  "facts/chiyoko.md「喜欢的东西」：她会认真挑适合对方口味的巧克力，第 5 段",
]

[[paragraphs]]
ja = "[brightly] お元気ですか？　園田智代子です！　実は私、ちょこっとだけ遠くへ行くことになりまして、こうしてお手紙を書いています！"
zh = "你好吗？我是园田智代子！其实呢，我要去稍微远一点的地方了，所以写了这封信！"

[[paragraphs]]
ja = "思えば、あのオーディション会場でプロデューサーさんが見つけてくれたから、チョコアイドルの私がいるんですよね。"
zh = "回想起来，正是因为制作人在那次试镜会场发现了我，才有了巧克力偶像的我呢。"

[[paragraphs]]
ja = "焼き芋も、カニも、ホットチョコも。プロデューサーさんと分けて食べると、なんだかいつもの倍くらい、美味しかったです。"
zh = "烤红薯也好，螃蟹也好，热巧克力也好。和制作人分着吃，总觉得比平时好吃一倍。"

[[paragraphs]]
ja = "[softly] 普通の私に、特別な時間をたくさんくれて、本当にありがとうございました。これだけは、ちゃんと書きたくて。"
zh = "谢谢你给了普普通通的我那么多特别的时光。只有这句话，我一定要好好写下来。"

[[paragraphs]]
ja = "[perking up] なので、不肖・園田智代子、次に会う日までに、プロデューサーさんにぴったりのチョコを探しておく所存です！"
zh = "所以，不才园田智代子，打算在下次见面之前，找到最适合制作人的巧克力！"
