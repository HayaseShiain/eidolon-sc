# 桑山千雪的信
character = "chiyuki"
salutation = "プロデューサーさんへ"
signature = "桑山千雪"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/chiyuki.md「自称」：自称「私」",
  "sheets/chiyuki.md「对他人的称呼」：叫制作人「プロデューサーさん」，叫甘奈「甘奈ちゃん」、甜花「甜花ちゃん」",
  "sheets/chiyuki.md「口癖」：对制作人说「です・ます」，笑声「ふふっ」",
  "facts/chiyuki.md「杂货与手工」：第 1 段，她喜欢玻璃笔",
  "facts/chiyuki.md「被发掘（W.I.N.G.）」：第 2 段，在街上叫住制作人、替他缝好快掉的袖扣，随后被问要不要当偶像",
  "sheets/chiyuki.md「身份」：第 2 段，当时在杂货店工作，一开始推辞了当偶像",
  "facts/chiyuki.md「从杂货店到偶像」：第 3 段，辞掉店里的工作专心当偶像，但说只要有人因此露出笑容，就不会停止做杂货",
  "sheets/chiyuki.md「身份」：第 3 段，以前的店长说她「欲張り」，想要的东西都想要；制作人教她走的是什么都不必放弃的路",
  "facts/chiyuki.md「制作人」：第 3 段，她说杂货和偶像都没有放弃，是因为有制作人在（只取意思，不引原句）",
  "facts/chiyuki.md「组合成立（よっつのものがたり）」：第 4 段，是制作人觉得她和双胞胎合得来，三人才组成组合",
  "facts/chiyuki.md「兴趣与特技」：第 5 段，她常替制作人补衣服、缝扣子",
]

[[paragraphs]]
ja = "[gently] お気に入りのガラスペンで、この手紙を書いています。少し遠くへ行くことになったので、きちんとお伝えしたくて。"
zh = "我在用最喜欢的玻璃笔写这封信。我要去稍远的地方了，所以想好好地告诉你一声。"

[[paragraphs]]
ja = "街で思わずお声をかけて、袖のボタンを付け直したあの日。まさか私がアイドルになるなんて、思ってもみませんでした。"
zh = "在街上忍不住叫住你、替你缝好袖扣的那一天。那时完全没想到，我会成为偶像。"

[[paragraphs]]
ja = "お店を辞めても、雑貨づくりは続けてこられました。欲張りな私のままでいられたのは、プロデューサーさんのおかげです。"
zh = "辞掉了店里的工作，做杂货却一直没有停下。我能一直做那个贪心的自己，都是多亏了制作人。"

[[paragraphs]]
ja = "甘奈ちゃんと甜花ちゃんに会わせてくださったことも、ずっと感謝しています。三人で過ごした時間は、私の宝物です。"
zh = "让我遇见甘奈和甜花这件事，我也一直很感激。我们三个人一起度过的时光，是我的宝物。"

[[paragraphs]]
ja = "[warmly, a little teasing] 取れかけたボタンを見つけたら、私が戻るまでそのままにしておいてくださいね。また直しに行きますから。ふふっ。"
zh = "要是发现哪颗扣子快掉了，请先别管，等我回来哦。我会再来帮你缝好的。呵呵。"
