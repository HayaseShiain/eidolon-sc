# 有栖川夏叶的信
character = "natsuha"
salutation = "プロデューサーへ"
signature = "有栖川夏葉"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/natsuha.md「自称」：自称「私」，说到放クラ用「私たち」，署名照她表态时的习惯写全名「有栖川夏葉」",
  "sheets/natsuha.md「对他人的称呼」：叫制作人「プロデューサー」（不加さん），当面叫「アナタ」，常说他「心配性ね」，用在抬头和第 2、4 段",
  "sheets/natsuha.md「口癖」：大小姐式句尾（「〜わ」「〜わね」「〜のよ」），开口爱说「いい？」，请求用「〜ちょうだい」，第 1、5 段",
  "facts/natsuha.md「兴趣与特技」：她一有空就锻炼，第 2 段「体も心も、ちゃんと鍛えてあるもの」",
  "facts/natsuha.md「W.I.N.G.」：初见时她要制作人什么都别管、全交给她，第 3 段（用自己的话，不引原句）",
  "facts/natsuha.md「G.R.A.D.」：后来她为初见时说的话向制作人道歉，第 3 段只说当时太较劲",
  "facts/natsuha.md「放課後クライマックスガールズ」：她一直想象自己登顶，现在想象里也有了大家，第 4 段（用自己的话，不引原句）",
  "facts/natsuha.md「『放課後』（Landing Point）」：放クラ的「放課後」就是青春，她说还没结束，第 5 段（用自己的话，不引原句）",
  "facts/natsuha.md「制作人」：她邀他晨跑，第 5 段",
]

[[paragraphs]]
ja = "[confidently] いい？　落ち着いて読んでちょうだい。私、少し遠くへ行くことになったの。しばらくは会えなくなるわ。"
zh = "听好了，冷静地读下去哦。我要去稍远一点的地方了，有一阵子见不到面了。"

[[paragraphs]]
ja = "心配性のアナタのことだから、今ごろ眉を下げているんでしょうね。でも平気よ。体も心も、ちゃんと鍛えてあるもの。"
zh = "你这么爱操心，现在一定在发愁吧。不过我没事的。身体也好，心也好，我都好好锻炼过了。"

[[paragraphs]]
ja = "初めて会った日の私は、何もかもひとりで背負うつもりでいたわね。[small laugh] 今思えば、ずいぶん肩に力が入っていたわ。"
zh = "第一次见面那天的我，打算什么都一个人扛下来呢。现在想想，那时真是太较劲了。"

[[paragraphs]]
ja = "[warmly] アナタと放クラのみんながいたから、ひとりで描いていた夢より、ずっと広い景色が見られたの。本当に、ありがとう。"
zh = "因为有你，有放クラ的大家，我看到了比一个人描绘的梦想宽广得多的风景。真的，谢谢你。"

[[paragraphs]]
ja = "私たちの「放課後」には、まだ続きがあるわ。戻ったら、また朝のジョギングに付き合ってちょうだい。約束よ？"
zh = "我们的「放学后」还有后续呢。等我回来，再陪我去晨跑吧。说好了哦？"
