# 杜野凛世的信
character = "rinze"
salutation = "プロデューサーさまへ"
signature = "凛世"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/rinze.md「自称」：用自己的名字「凛世」自称，第 2、4 段和署名",
  "sheets/rinze.md「对他人的称呼」：叫制作人「プロデューサーさま」，郑重时「貴方さま」，用在抬头和正文；叫伙伴「果穂さん」「智代子さん」「樹里さん」「夏葉さん」，第 3 段",
  "sheets/rinze.md「口癖」：古雅的敬语（「〜ございました」「参ります」「ゆえ」），第 1、2、5 段；信里不用她说话时的「……」，照她在剧情里写信的样子用句号",
  "facts/rinze.md「S.T.E.P.」：她写了一封信没有寄出，第 1 段说这次会寄到（facts 记作写给姐姐；sources.md 所列 S.T.E.P.編 / 101200506 (6) 原文里那封信的开头是『プロデューサーさま、凛世は、』，她说「この手紙は……まだ出さない」，信里不写收信人，两种读法都通）",
  "facts/rinze.md「喜欢的东西」：她喜欢写信、贺年卡全部手写，第 1 段整封信以手写的信自居",
  "facts/rinze.md「W.I.N.G.」：她在街上木屐带子断了，制作人用手帕和五元硬币替她修好，第 2 段（「縁」是信里自己的说法）",
  "facts/rinze.md「放課後クライマックスガールズ」：她以前不知道和大家一起成就一件事是什么滋味，有了朋友以后才知道，第 3 段（用自己的话，不引原句）",
  "facts/rinze.md「卡片里的工作与日常」：【さよならごつこ】年末回鸟取过年，她以为这就是分别，回东京时制作人在站台接她，第 4、5 段（用自己的话，不引原句）",
  "facts/rinze.md「制作人」：和他一起看月亮时说「同じ時……/同じ月を……」，第 5 段「見上げる月はひとつ」（用自己的话，不引原句）",
]

[[paragraphs]]
ja = "[softly, slowly] いつぞや、したためたまま、出さずにしまった手紙がございました。今度の手紙は、きちんと貴方さまへお届けいたします。"
zh = "从前，凛世写好了一封信，却一直没有寄出。这一封，一定会好好送到您手上。"

[[paragraphs]]
ja = "凛世は、しばし遠くへ参ります。あの日、鼻緒を結んでくださったハンカチと五円玉。そのご縁を、胸に抱いてゆきます。"
zh = "凛世要暂时去远方了。那天，您用手帕和五元硬币帮我系好了木屐带子。这份缘分，凛世会放在心里带走。"

[[paragraphs]]
ja = "果穂さん、智代子さん、樹里さん、夏葉さん。皆さまと共にひとつの舞台を作る喜びも、貴方さまのおかげで知りました。"
zh = "果穗、智代子、树里、夏叶。和大家一起完成同一个舞台的喜悦，也是托您的福才知道的。"

[[paragraphs]]
ja = "年の暮れに里へ帰る折も、これでお別れかと案じました。けれど戻った凛世を、貴方さまはホームで迎えてくださいました。"
zh = "有一年年底回老家的时候，凛世也担心过，这会不会就是分别。可是凛世回来时，您在站台上接了我。"

[[paragraphs]]
ja = "[gently] ゆえに今度も、お別れとは思っておりません。離れておりましても、見上げる月はひとつ。[pause] どうか、お健やかに。"
zh = "所以这一次，凛世也不觉得是分别。即使相隔两地，抬头看到的也是同一轮月亮。请您务必保重。"
