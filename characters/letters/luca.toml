# 斑鸠路加的信
character = "luca"
salutation = "アンタへ"
signature = "ルカ"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/luca.md「自称」：自称「私」，很多句子省掉主语",
  "sheets/luca.md「对他人的称呼」：叫制作人最常用「アンタ」，抬头用它；几乎不叫「プロデューサー」；提起羽那、はるき时说「アイツら」，第 4 段",
  "sheets/luca.md「口癖」：粗、短，「〜だろ」「〜じゃねェ」、小写的「ェ」；被戳中时话变短「……どうも」，第 3 段",
  "sheets/luca.md「硬性规则」：不变得热情坦率，关心人也用嫌弃的口气，整封信照这个写",
  "facts/luca.md「制作人」：后来她会说「本当に困れば言う」「話すって言ったんだから」，第 1 段（只转述）",
  "facts/luca.md「来到283」：闭门不出时制作人把饭挂在她家门把手上，她回「帰れ」，第 2 段",
  "facts/luca.md「W.I.N.G.」：她拒绝一切支持、一个人练，制作人说要支持她，第 3 段（只转述）",
  "facts/luca.md「鈴木羽那」：羽那总是笑着拉她的手，第 4 段",
  "sheets/luca.md「与组合伙伴的关系」：在羽那、はるき看不到的地方替她们打点，被道谢也不认，第 4 段",
  "facts/luca.md「G.R.A.D.」：夺冠后她主动叫住制作人，「一緒に進みたいんじゃねぇのかよ」，第 5 段（只转述）",
  "facts/luca.md「Landing Point」：和制作人去吃饭，点了ナポリタン和纯红茶，第 5 段",
  "facts/luca.md「吃的东西」：在外面点ナポリタン时说「特別好きってわけじゃない/……ここのは」；被请吃饭时说「私は高い肉にいく」，第 5 段「アンタのおごり」",
]

[[paragraphs]]
ja = "[low, flat] 話すって言ったのは私だからな。黙って消えんのは、ナシにしとく。しばらく遠くに行く。それだけだ。"
zh = "说过有事会讲的，是我。所以一声不吭就消失，这种事我不干。我要去远的地方待一阵子。就这样。"

[[paragraphs]]
ja = "閉じこもってた頃、毎日ドアノブにメシぶら下げてきやがって。帰れっつっても、また来るし。……ほんと、しつこかった。"
zh = "我把自己关在屋里那阵子，你天天往门把手上挂饭。叫你回去，你还是照来。……真是烦死人了。"

[[paragraphs]]
ja = "ひとりでいいっつったのに、勝手に構ってきやがって。礼なんか書かねェぞ。[pause]<soft>…………どうも</soft>。"
zh = "我都说了一个人就行，你还自作主张来管我。谢字我是不会写的。……谢了。"

[[paragraphs]]
ja = "アイツらのこと、見とけよ。うるせェし、すぐ人の手ぇ引っぱってくるけど。……私が言ったって、言うなよ。"
zh = "那两个家伙，你给我看好了。又吵，动不动就拽人家的手。……别说是我讲的。"

[[paragraphs]]
ja = "一緒に進むって話、取り消したわけじゃねェからな。戻ったら、あの店のナポリタン。アンタのおごりな。"
zh = "一起往前走那件事，我可没说作废。回来以后，那家店的拿坡里意面，你请。"
