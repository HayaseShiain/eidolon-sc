# 浅仓透的信
character = "toru"
salutation = "プロデューサー"
signature = "透"
# 信里每一处经历、称呼、自称的出处：文件和小节标题，后面一句说明用在哪
sources = [
  "sheets/toru.md「自称」：自称「私」但多数句子省掉主语，信里全程不带主语",
  "sheets/toru.md「对他人的称呼」：叫制作人「プロデューサー」，不加「さん」；抬头和第 4 段用它",
  "sheets/toru.md「口癖」：短句、倒装（第 1 段「書くね、手紙」、第 3 段「けっこう来たよね、高いとこ」、第 4 段「嬉しかったんだ、あれ」），タメ口，「めっちゃ」「じゃん」「でしょ」；「のぼる」「てっぺん」是她反复说的词",
  "facts/toru.md「小时候的称呼」：她让制作人叫她「透」，说这个音好听；署名只写「透」",
  "facts/toru.md「日誌」：第 1、2 段，以前日誌只写了一句就让制作人满城找她，这次好好写、也说清楚了，所以不用找",
  "facts/toru.md「成为偶像的经过」：第 3 段在公交站遇见制作人；第 4 段签约时问他当了偶像能不能飞，他给了回答",
  "facts/toru.md「ジャングルジムの夢」：第 3 段一直和他一起往上爬、还没到顶",
  "facts/toru.md「制作人」：第 5 段两人录过一卷要十年后再听的磁带",
]

[[paragraphs]]
ja = "[softly] 書くね、手紙。前は日誌を一行で済ませて、めっちゃ探させちゃったし。だから今回は、ちゃんと書く。"
zh = "写啦，信。之前日志只写一行就交差，害你到处找我。所以这次，我好好写。"

[[paragraphs]]
ja = "ちょっと遠く、行くことになった。しばらく会えないかも。あ、でも今度は探さなくていいよ。ちゃんと言ったから。"
zh = "我要去有点远的地方了。可能有阵子见不到。啊，不过这次不用找我哦。我已经好好说过了。"

[[paragraphs]]
ja = "バス停で会った日から、ずっとのぼってた気がする。一緒に。けっこう来たよね、高いとこ。てっぺんは、まだだけど。"
zh = "从在公交站遇见那天起，感觉一直在往上爬。和你一起。爬到挺高的地方了呢。虽然还没到顶。"

[[paragraphs]]
ja = "ありがと、プロデューサー。飛べるかって聞いたとき、まっすぐ答えてくれたじゃん。[pause] 嬉しかったんだ、あれ。"
zh = "谢啦，制作人。我问能不能飞的时候，你直直地回答了我。那时候，我挺开心的。"

[[paragraphs]]
ja = "十年経ったら聞くテープ、録ったでしょ。あれ、一緒に聞こ。[smiling] その前に、たぶん戻るけど。"
zh = "我们录过一盘说好十年后再听的磁带吧。那个，一起听吧。不过在那之前，我大概就回来了。"
