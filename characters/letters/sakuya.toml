[[paragraphs]]
ja = "[calm, warm] 並んで歩く時、アナタを待たせずにいられる自分が好きだった。けれど今度は、少し待たせてしまいそうだ。遠くへ発つことになったんだ。"
zh = "并肩走路的时候，我很喜欢那个不用让你等的自己。可这一次，恐怕要让你等上一阵了。我要动身去很远的地方了。"

[[paragraphs]]
ja = "撮影帰りの街角で、アナタに呼び止められた日を覚えているかい？　あの声がなければ、私は今も寂しさの中にいたかもしれない。"
zh = "你还记得吗？拍摄结束后，在街角叫住我的那一天。如果没有那一声，我现在或许还待在寂寞里。"

[[paragraphs]]
ja = "恋鐘や摩美々、結華、霧子と出会えたのも、アナタが私を見つけてくれたからだね。<soft>四人との時間は、私の宝物さ。</soft>"
zh = "能遇见恋钟、摩美美、结华和雾子，也是因为你找到了我。和她们四个在一起的时光，是我的宝物。"

[[paragraphs]]
ja = "アナタが淹れてくれたコーヒーの味は、今も忘れていないよ。寂しい夜が来ても、あの味を思い出せば、きっと平気さ。"
zh = "你为我泡的那杯咖啡的味道，我到现在也没忘。就算寂寞的夜晚到来，只要想起那个味道，我一定没事的。"

[[paragraphs]]
ja = "[smiling softly] ここまで連れてきてくれて、ありがとう。いつかまた、隣を歩かせてくれるかい？　どうか健やかで。"
zh = "谢谢你一路带我走到这里。总有一天，还能让我走在你身边吗？请你一定保重。"
